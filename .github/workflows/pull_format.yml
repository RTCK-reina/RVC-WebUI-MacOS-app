name: Check Pull Request Base

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  # Close PRs that target a branch other than `main` (this fork's default
  # branch). Formatting and tests are gated by ci.yml.
  close_pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Close PR if it is not pointed to the main branch
        if: github.event.pull_request.base.ref != 'main'
        uses: superbrothers/close-pull-request@v3
        with:
          comment: "Invalid PR to non-`main` branch `${{ github.event.pull_request.base.ref }}`. Please retarget this PR to `main`."
