name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install Black
        run: pip install "black[jupyter]==24.10.0"

      - name: Check formatting
        run: black --check --diff .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      # The test suite stubs out the heavy RVC runtime (see tests/conftest.py),
      # so CI only needs the few real packages that a handful of tests touch
      # directly: numpy/scipy/av (audio I/O) and a CPU build of torch
      # (checkpoint-merge regression tests).
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest "numpy==1.23.5" scipy av
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: pytest
