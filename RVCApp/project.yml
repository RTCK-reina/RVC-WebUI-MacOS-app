# xcodegen input. Run `xcodegen` in this directory to (re)generate RVCApp.xcodeproj.
# Install xcodegen via: brew install xcodegen
name: RVCApp
options:
  bundleIdPrefix: app.rvc
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: RVCApp/RVCApp.entitlements
    INFOPLIST_FILE: RVCApp/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: app.rvc.webui
    PRODUCT_NAME: RVC-WebUI
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  RVCApp:
    type: application
    platform: macOS
    sources:
      - path: RVCApp
        excludes:
          - "Info.plist"
          - "RVCApp.entitlements"
    settings:
      base:
        INFOPLIST_FILE: RVCApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: RVCApp/RVCApp.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: app.rvc.webui
    dependencies: []
